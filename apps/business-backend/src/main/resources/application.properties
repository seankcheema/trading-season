spring.application.name=trading-app-platform
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trading_season}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:trading_season}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Schema is managed by dua-leapa-schema.sql, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Public simulated market-data replay.
market.replay.tick-millis=${MARKET_REPLAY_TICK_MILLIS:1000}
market.replay.start-at=${MARKET_REPLAY_START_AT:}
market.cors.allowed-origins=${MARKET_CORS_ALLOWED_ORIGINS:http://localhost:4200}
market.limits.rest-requests-per-minute=${MARKET_REST_REQUESTS_PER_MINUTE:120}
market.limits.streams-per-client=${MARKET_STREAMS_PER_CLIENT:3}
market.limits.streams-global=${MARKET_STREAMS_GLOBAL:200}
