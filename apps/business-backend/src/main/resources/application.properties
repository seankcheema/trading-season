spring.application.name=trading-app-platform
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/paysprint}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:paysprint}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

# Schema is managed by dua-leapa-schema.sql, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
