<div class="bg-background min-h-screen px-4 pb-8 md:px-6">
  <div class="mx-auto flex max-w-2xl flex-col gap-4">
    <header class="flex min-h-16 items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <img src="2b-waves.svg" alt="" class="size-8 shrink-0" />
        <span class="text-lg font-semibold tracking-tight">Settings</span>
      </div>
      <a
        routerLink="/dashboard"
        class="text-muted-foreground hover:text-foreground flex items-center gap-1.5 text-sm transition-colors"
      >
        <ng-icon name="lucideArrowLeft" class="text-[16px]" />
        Back to dashboard
      </a>
    </header>

    <section hlmCard class="rounded-[10px]" aria-labelledby="security-heading">
      <div hlmCardHeader>
        <h2 hlmCardTitle id="security-heading">Security</h2>
        <p hlmCardDescription>Control how long you stay signed in on this browser.</p>
      </div>

      <div hlmCardContent>
        <div hlmField>
          <label hlmFieldLabel for="idleTimeout" class="text-foreground">
            Sign out after inactivity
          </label>
          <hlm-native-select
            [selectId]="'idleTimeout'"
            [selectClass]="'cursor-pointer rounded-[5px]'"
            [formControl]="idleTimeout"
          >
            @for (minutes of timeoutOptions; track minutes) {
              <option [value]="minutes" hlmNativeSelectOption>
                {{ minutes }} minutes{{ minutes === defaultTimeout ? ' (default)' : '' }}
              </option>
            }
          </hlm-native-select>
          <p class="text-muted-foreground text-sm">
            You will be signed out automatically when there is no mouse, keyboard or touch input
            for this long. Changes apply immediately.
          </p>
        </div>
      </div>
    </section>
  </div>
</div>
