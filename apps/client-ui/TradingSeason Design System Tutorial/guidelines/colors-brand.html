<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:10px;border:1px solid var(--border)}.n{font-size:12px;font-weight:600}.v{font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lab{color:var(--muted-foreground);font-size:.75rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--ts-cyan)"></div><div class="n">Primary</div><div class="v">--ts-cyan</div></div><div class="sw"><div class="chip" style="background:var(--ts-cyan-mid)"></div><div class="n">Cyan mid</div><div class="v">--ts-cyan-mid</div></div><div class="sw"><div class="chip" style="background:var(--ts-cyan-pale)"></div><div class="n">Cyan pale</div><div class="v">--ts-cyan-pale</div></div><div class="sw"><div class="chip" style="background:var(--ts-frost)"></div><div class="n">Frost (fg)</div><div class="v">--ts-frost</div></div><div class="sw"><div class="chip" style="background:var(--ts-deep-sea)"></div><div class="n">Deep sea</div><div class="v">--ts-deep-sea</div></div></div></body></html>
