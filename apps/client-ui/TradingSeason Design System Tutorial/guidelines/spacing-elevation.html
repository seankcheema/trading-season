<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:10px;border:1px solid var(--border)}.n{font-size:12px;font-weight:600}.v{font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lab{color:var(--muted-foreground);font-size:.75rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase}</style></head><body><div class="row" style="gap:24px;padding:10px"><div style="width:180px;height:100px;border:1px solid var(--border);border-radius:14px;background:var(--card);padding:12px" class="v">dash-card<br>1px border, no shadow</div><div style="width:180px;height:100px;border:1px solid var(--border);border-radius:12px;background:var(--popover);box-shadow:var(--shadow-xl);padding:12px" class="v">dropdown panel<br>shadow-xl</div><div style="width:180px;height:100px;border:1px solid var(--border);border-radius:16px;background:var(--card);box-shadow:var(--shadow-dialog);padding:12px" class="v">dialog<br>shadow-2xl black/50</div></div></body></html>
