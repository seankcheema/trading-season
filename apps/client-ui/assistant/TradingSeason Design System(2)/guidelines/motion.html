<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:10px;border:1px solid var(--border)}.n{font-size:12px;font-weight:600}.v{font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lab{color:var(--muted-foreground);font-size:.75rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase}</style></head><body><style>.b{width:60px;height:60px;border-radius:16px;background:var(--card);border:1px solid var(--border);animation:ts-pop-in 200ms var(--ease-out-expo) infinite alternate}.d{position:relative;width:12px;height:12px}.d span{position:absolute;inset:0;border-radius:50%;background:var(--primary)}</style><div class="row" style="gap:40px;align-items:center"><div style="display:flex;gap:14px;align-items:center"><div class="b"></div><div class="v">Dialog pop-in<br>200ms · cubic-bezier(.16,1,.3,1)<br>translateY(8px) scale(.98)</div></div><div style="display:flex;gap:20px;align-items:center"><div class="d"><span style="animation:ts-pulse 2.4s ease-out infinite"></span><span style="box-shadow:0 0 0 4px var(--background)"></span></div><div class="v">Live-point pulse<br>2.4s ease-out · scale 1→3.5</div></div><div class="v">Hover: 150ms color<br>Press: translateY(1px)</div></div></body></html>
