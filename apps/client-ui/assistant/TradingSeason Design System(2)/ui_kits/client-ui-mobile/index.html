<!-- @dsCard group="Client UI Mobile" viewport="430x900" name="Client UI — mobile web" subtitle="Home, assets, activity, account tabs with order, cash and search sheets" -->
<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<title>TradingSeason</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<link rel="icon" type="image/svg+xml" href="../../assets/2b-waves.svg">
<link rel="stylesheet" href="../../styles.css">
<style>
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#050505}
#ts-layout{position:fixed;top:16px;left:16px;display:flex;gap:2px;padding:2px;border-radius:8px;background:#1a1a1a;z-index:10}#ts-layout button{border:0;border-radius:6px;padding:6px 12px;font:500 12px/1 Archivo,sans-serif;cursor:pointer;background:transparent;color:rgba(238,250,255,.5)}#ts-layout button[aria-pressed=true]{background:#00bbff;color:#0e0e0e}
.ts-frame{position:relative;width:390px;height:844px;overflow:hidden;border:1px solid var(--border);border-radius:32px;background:var(--background);display:flex;flex-direction:column;transform:translateZ(0)}
@media (max-width:500px){#ts-layout{display:none}body{display:block}.ts-frame{width:100vw;height:100dvh;border:0;border-radius:0}}
@keyframes ts-sheet-in{from{transform:translateY(100%)}}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../_shared/market-data.js"></script>
</head>
<body>
<div id="root" class="ts-frame"></div>
<script type="text/babel" src="../_shared/OrderTicket.jsx"></script>
<script type="text/babel" src="../client-ui/Landing.jsx"></script>
<script type="text/babel" src="../client-ui/AuthScreens.jsx"></script>
<script type="text/babel" src="MobileShell.jsx"></script>
<script type="text/babel" src="MobileScreens.jsx"></script>
<script type="text/babel" src="MobileSheets.jsx"></script>
<script type="text/babel" src="MobileLanding.jsx"></script>
<script type="text/babel" src="MobileFlat.jsx"></script>
<script type="text/babel">
function MobileApp() {
  const saved = JSON.parse(localStorage.getItem('ts-mobile') || '{"route":"app","tab":"home"}');
  const [assetsView, setAssetsView] = React.useState('assets');
  const [route, setRoute] = React.useState(saved.route);
  const [tab, setTabState] = React.useState(saved.tab);
  const [account, setAccount] = React.useState(1);
  const [sheet, setSheet] = React.useState(null);
  const [layout, setLayoutState] = React.useState(() => new URLSearchParams(location.search).get('layout') || localStorage.getItem('ts-mobile-layout') || 'cards');
  const setLayout = (l) => { setLayoutState(l); localStorage.setItem('ts-mobile-layout', l); };
  const flat = layout === 'flat';
  const switcher = ReactDOM.createPortal(<div id="ts-layout" role="group" aria-label="Layout">{[['cards', 'Cards'], ['flat', 'Flat']].map(([k, l]) => <button key={k} type="button" aria-pressed={layout === k} onClick={() => setLayout(k)}>{l}</button>)}</div>, document.body);
  const scroller = React.useRef(null);
  const persist = (r, t) => localStorage.setItem('ts-mobile', JSON.stringify({ route: r, tab: t }));
  const go = (r) => { setRoute(r); persist(r, tab); };
  const setTab = (t, view) => { if (view) setAssetsView(view); else if (t === 'assets') setAssetsView('assets'); setTabState(t); persist(route, t); if (scroller.current) scroller.current.scrollTop = 0; };
  const close = () => setSheet(null);
  const openOrder = (s) => setSheet({ kind: 'order', symbol: s });

  if (route !== 'app') {
    const Screen = { landing: MobileLanding, login: Login, register: Register }[route];
    return <>{switcher}<div className="ts-scroll" style={{ flex: 1, minHeight: 0, overflowY: 'auto' }}><Screen go={(r) => go(r === 'dashboard' ? 'app' : r)} mobile /></div></>;
  }
  return (
    <>
      {switcher}
      <TopBar accountId={account} onAccount={() => setSheet({ kind: 'account' })} onSearch={() => setSheet({ kind: 'search' })} onProfile={() => setTab('account')} />
      <main ref={scroller} className="ts-scroll" style={{ flex: 1, minHeight: 0, overflowY: 'auto' }}>
        {tab === 'home' ? (flat ? <FlatHome accountId={account} openOrder={openOrder} openCash={(m) => setSheet({ kind: 'cash', mode: m })} setTab={setTab} onSearch={() => setSheet({ kind: 'search' })} /> : <MobileHome accountId={account} openOrder={openOrder} openCash={(m) => setSheet({ kind: 'cash', mode: m })} setTab={setTab} />) : null}
        {tab === 'assets' ? (flat ? <FlatAssets openOrder={openOrder} view={assetsView} setView={setAssetsView} /> : <MobileAssets openOrder={openOrder} view={assetsView} setView={setAssetsView} />) : null}
        {tab === 'activity' ? (flat ? <FlatActivity /> : <MobileActivity />) : null}
        {tab === 'account' ? (flat ? <FlatAccount accountId={account} onPick={setAccount} onSignOut={() => go('landing')} /> : <MobileAccount accountId={account} onPick={setAccount} onSignOut={() => go('landing')} />) : null}
      </main>
      <TabBar tab={tab} setTab={setTab} />
      {sheet && sheet.kind === 'order' ? <OrderSheet symbol={sheet.symbol} onClose={close} /> : null}
      {sheet && sheet.kind === 'cash' ? <CashSheet mode={sheet.mode} onClose={close} /> : null}
      {sheet && sheet.kind === 'search' ? <SearchSheet onClose={close} openOrder={openOrder} /> : null}
      {sheet && sheet.kind === 'account' ? <AccountSheet accountId={account} onPick={setAccount} onClose={close} /> : null}
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<MobileApp />);
</script>
</body>
</html>
