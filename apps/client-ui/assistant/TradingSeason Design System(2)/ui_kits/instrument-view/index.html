<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<title>TradingSeason · Market</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../../assets/2b-waves.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../_shared/market-data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../_shared/OrderTicket.jsx"></script>
<script type="text/babel" src="MarketChart.jsx"></script>
<script type="text/babel" src="MarketTools.jsx"></script>
<script type="text/babel" src="MarketPage.jsx"></script>
<script type="text/babel" src="../_shared/AssistantLauncher.jsx"></script>
<script type="text/babel">
function MarketApp() {
  const initial = new URLSearchParams(location.search).get('symbol') || localStorage.getItem('ts-instrument') || 'AAPL';
  const [symbol, setSymbol] = React.useState(TSData.find(initial) ? initial : 'AAPL');
  const pick = (s) => { setSymbol(s); localStorage.setItem('ts-instrument', s); history.replaceState(null, '', '?symbol=' + s); };
  return <><MarketPage symbol={symbol} setSymbol={pick} onBack={() => { location.href = '../client-ui/index.html'; }} /><AssistantLauncher instrument={TSData.find(symbol)} /></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<MarketApp />);
</script>
</body>
</html>
