# Local stand-in for CloudFront in front of S3: it serves the built bundle and sends
# the same paths to the same backends that the CloudFront behaviours must (see
# Static UIs on S3 in infrastructure/README.md). Used by the local Compose stack
# only; Jenkins builds no UI image.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the service names on each request through Docker's DNS, so a service
    # container that Compose recreates (a rebuild, a restart) is reached at its new
    # address without restarting this container. A name resolved once at startup,
    # which is what a literal proxy_pass does, answers 502 until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $order_and_sell http://order-and-sell-service:8081;
    set $holdings_and_trade http://holdings-and-trade-service:8082;
    set $auth http://auth-service:3001;

    # Trading lives in the Order and Sell Service; everything else the UI calls
    # (accounts, holdings, portfolio history/capture, cash, profile, market data) is served by Holdings and
    # Trade. These two blocks are longer prefixes than /api/ below, so nginx
    # matches them first. Each service's port comes from its own
    # application.properties: order-and-sell listens on 8081, holdings-and-trade
    # on 8082.
    # /api/orders/stream is a server-sent event stream, so responses are not buffered.
    location /api/orders {
        proxy_pass $order_and_sell;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/orders/stream is server-sent events: each frame must reach the
        # browser as it arrives, not when a buffer fills. The service's 15 s
        # heartbeat keeps the connection under the default read timeout.
        proxy_buffering off;
    }

    location /api/instruments {
        proxy_pass $order_and_sell;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/me/watchlist {
        proxy_pass $holdings_and_trade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/me/dua {
        proxy_pass $holdings_and_trade;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Also carries /api/market/stream, a server-sent event stream.
    location /api/ {
        proxy_pass $holdings_and_trade;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sign-in, registration, token refresh and sign-out, on the UI's own origin.
    location /auth/ {
        proxy_pass $auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Prerendered routes are directories (login/, register/); serve their index
        # directly rather than letting $uri/ redirect to the container's own port.
        try_files $uri $uri/index.html /index.html;
    }
}
