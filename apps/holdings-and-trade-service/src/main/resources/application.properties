spring.application.name=holdings-and-trade-service
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trading_season}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:trading_season}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

# Schema is managed by dua-leapa-schema.sql, not Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Access tokens are RS256 JWTs issued by the NestJS auth service. The public key
# is fetched from its JWKS endpoint on first use and cached; the auth service is
# not called per request. The issuer must match the auth service's JWT_ISSUER.
app.auth.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:3001/.well-known/jwks.json}
app.auth.issuer=${AUTH_JWT_ISSUER:https://auth.dualeapa.local}

# Browser origins allowed to call this API, comma-separated. Never a wildcard.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Optional override for Parquet sessions whose imported absolute archive path is not
# reachable from this runtime. Local development also discovers the repository seeds folder.
market.replay.archive-location=${MARKET_REPLAY_ARCHIVE_LOCATION:}

# Event broker. Consumer group portfolio-valuation-capture reads trade-events, which
# Order and Sell publishes, and records a portfolio valuation for the account whenever
# an order fills. On the host the broker is localhost:29092; inside Compose it is kafka:9092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# The reporting service has no database connection. Every profile, account, deposit,
# withdrawal and portfolio valuation this service writes is published to platform-records
# after its transaction commits, keyed by record type and id; the kafka container creates the topic
# compacted, so it keeps the latest state of every row.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# A send waits for broker metadata at most this long. The write is already committed
# by then, so an unreachable broker delays the response but never changes it.
spring.kafka.producer.properties[max.block.ms]=5000

# Gates the consumer and the platform-records publisher. The test profile turns it off
# so contexts that only need the database never contact a broker.
app.events.enabled=true
# The scheduler values every account every minute. Reporting only needs a recent value,
# so a scheduled valuation of one account is published at most this often; a valuation
# captured for a fill or a dashboard is always published.
app.events.valuation-interval-minutes=15

# Swagger/OpenAPI configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
