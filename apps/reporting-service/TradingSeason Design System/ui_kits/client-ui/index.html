<!-- @dsCard group="Client UI" viewport="1440x900" name="Client UI" subtitle="Landing → auth → dashboard with order, cash and settings dialogs" -->
<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<title>TradingSeason</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../../assets/2b-waves.svg">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../_shared/market-data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../_shared/AppHeader.jsx"></script>
<script type="text/babel" src="../_shared/OrderTicket.jsx"></script>
<script type="text/babel" src="Landing.jsx"></script>
<script type="text/babel" src="AuthScreens.jsx"></script>
<script type="text/babel" src="Dialogs.jsx"></script>
<script type="text/babel" src="ViewAllDialogs.jsx"></script>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel">
function ClientApp() {
  const [route, setRoute] = React.useState(() => localStorage.getItem('ts-client-route') || 'dashboard');
  const [order, setOrder] = React.useState(null);
  const [cash, setCash] = React.useState(null);
  const [settings, setSettings] = React.useState(false);
  const [viewAll, setViewAll] = React.useState(null);
  const [account, setAccount] = React.useState(1);
  const [timedOut, setTimedOut] = React.useState(false);
  const go = (r) => { setRoute(r); localStorage.setItem('ts-client-route', r); window.scrollTo(0, 0); };
  if (route === 'landing') return <Landing go={go} />;
  if (route === 'login') return <Login go={go} timedOut={timedOut} />;
  if (route === 'register') return <Register go={go} />;
  return (
    <div style={{ height: '100vh', overflow: 'hidden', padding: '0 24px 16px', background: 'var(--background)' }}>
      <div style={{ margin: '0 auto', display: 'flex', height: '100%', maxWidth: 1600, flexDirection: 'column' }}>
        <AppHeader accountId={account} onAccount={setAccount} onSettings={() => setSettings(true)} onSignOut={() => { setTimedOut(false); go('landing'); }} />
        <Dashboard accountId={account} openOrder={setOrder} openCash={setCash} openAllTransactions={() => setViewAll('transactions')} openAllAssets={() => setViewAll('assets')} />
      </div>
      {order ? <OrderDialog symbol={order} onClose={() => setOrder(null)} onExpand={(s) => { location.href = '../instrument-view/index.html?symbol=' + s; }} /> : null}
      {cash ? <CashDialog mode={cash} cash={4820.55} onClose={() => setCash(null)} /> : null}
      {settings ? <SettingsDialog onClose={() => setSettings(false)} /> : null}
      {viewAll === 'transactions' ? <AllTransactionsDialog onClose={() => setViewAll(null)} openOrder={setOrder} /> : null}
      {viewAll === 'assets' ? <AllAssetsDialog onClose={() => setViewAll(null)} openOrder={setOrder} /> : null}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<ClientApp />);
</script>
</body>
</html>
