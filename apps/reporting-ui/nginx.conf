# Local stand-in for CloudFront in front of S3: it serves the built bundle and sends
# the same paths to the same backends that the CloudFront behaviours must (see
# Static UIs on S3 in infrastructure/README.md). Used by the local Compose stack
# only; Jenkins builds no UI image.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;


    # Resolve the service names on each request through Docker's DNS, so a service

    # container that Compose recreates is reached at its new address without

    # restarting this container (see the Client UI's nginx.conf).

    resolver 127.0.0.11 valid=10s ipv6=off;

    set $reporting http://reporting-service:8083;

    set $auth http://auth-service:3001;
    index index.html;

    # The UI calls both backends on its own origin, so neither needs a CORS
    # entry for it. Each service's port comes from its own configuration: the
    # Reporting Service listens on 8083 and the Auth Service on 3001. Keep
    # these two blocks in step with proxy.conf.json.
    location /api/reporting/ {
        proxy_pass $reporting;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sign-in, token refresh and sign-out only. The auth service has no other
    # route under /auth.
    location /auth/ {
        proxy_pass $auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
