server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The UI calls both backends on its own origin, so neither needs a CORS
    # entry for it. Each service's port comes from its own configuration: the
    # Reporting Service listens on 8083 and the Auth Service on 3001. Keep
    # these two blocks in step with proxy.conf.json.
    location /api/reporting/ {
        proxy_pass http://reporting-service:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sign-in, token refresh and sign-out only. The auth service has no other
    # route under /auth.
    location /auth/ {
        proxy_pass http://auth-service:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
