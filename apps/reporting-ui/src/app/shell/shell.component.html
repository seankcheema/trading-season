<div
  class="bg-background grid h-dvh grid-cols-1 grid-rows-[auto_minmax(0,1fr)] transition-[grid-template-columns] duration-200 md:grid-rows-1"
  [class]="collapsed() ? 'md:grid-cols-[60px_minmax(0,1fr)]' : 'md:grid-cols-[232px_minmax(0,1fr)]'"
>
  <aside
    data-print-hide="true"
    class="bg-sidebar border-sidebar-border flex min-w-0 flex-wrap items-center gap-x-2 gap-y-1 overflow-hidden border-b px-3 pb-2 md:flex-col md:flex-nowrap md:items-stretch md:gap-1 md:border-r md:border-b-0 md:pb-4"
  >
    <div
      class="flex items-center"
      [class]="collapsed() ? 'md:flex-col md:gap-2 md:pt-4 md:pb-1' : 'md:justify-between'"
    >
      <a
        routerLink="/"
        class="flex h-16 items-center gap-2.5 px-1.5"
        [class]="collapsed() ? 'md:h-auto md:justify-center md:px-0' : ''"
        aria-label="TradingSeason Reporting home"
      >
        <img src="2b-waves.svg" alt="" class="size-7 shrink-0" />
        <span class="flex flex-col leading-[1.15]" [class]="collapsed() ? 'md:hidden' : ''">
          <span class="text-base font-semibold tracking-tight">TradingSeason</span>
          &ngsp;
          <span class="dash-label text-[11px]">Reporting</span>
        </span>
      </a>
      <button
        type="button"
        class="text-muted-foreground hover:bg-muted/50 hover:text-foreground hidden size-9 shrink-0 cursor-pointer items-center justify-center rounded-lg transition-colors md:flex"
        aria-controls="reporting-nav"
        [attr.aria-expanded]="!collapsed()"
        [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        [attr.title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        (click)="toggleSidebar()"
      >
        <ng-icon [name]="collapsed() ? 'lucidePanelLeftOpen' : 'lucidePanelLeftClose'" size="16" />
      </button>
    </div>

    <nav
      id="reporting-nav"
      aria-label="Reporting"
      class="order-last flex w-full flex-wrap gap-1 md:order-none md:flex-col md:flex-nowrap"
    >
      @for (item of nav(); track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive
          #link="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          ariaCurrentWhenActive="page"
          class="flex h-9 items-center gap-2.5 rounded-lg px-2.5 text-sm whitespace-nowrap transition-colors"
          [class]="
            (link.isActive
              ? 'bg-muted text-foreground font-medium'
              : 'text-muted-foreground hover:bg-muted/50 hover:text-foreground') +
            (collapsed() ? ' md:justify-center md:px-0' : '')
          "
          [attr.title]="collapsed() ? item.label : null"
        >
          <ng-icon [name]="item.icon" size="16" class="shrink-0" [class.text-primary]="link.isActive" />
          <span [class]="collapsed() ? 'md:sr-only' : ''">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="flex-1"></div>

    <div
      class="border-sidebar-border flex min-w-0 items-center gap-2.5 md:border-t md:pt-3"
      [class]="collapsed() ? 'md:flex-col md:justify-center md:gap-1' : 'md:px-2'"
    >
      <span
        class="bg-primary/15 text-primary flex size-8 shrink-0 items-center justify-center rounded-full text-xs font-semibold"
        [class]="collapsed() ? 'md:hidden' : ''"
        aria-hidden="true"
      >
        {{ userInitials() }}
      </span>
      <span
        class="hidden min-w-0 flex-1 leading-[1.3]"
        [class]="collapsed() ? 'sm:block md:hidden' : 'sm:block'"
      >
        <span class="block truncate text-sm">{{ userName() }}</span>
        @if (userDetail()) {
          <span class="text-muted-foreground block truncate text-xs">{{ userDetail() }}</span>
        }
      </span>
      <app-theme-toggle />
      <button
        type="button"
        class="text-muted-foreground hover:bg-loss/10 hover:text-loss flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-lg transition-colors"
        aria-label="Log out"
        title="Log out"
        (click)="logout()"
      >
        <ng-icon name="lucideLogOut" size="16" />
      </button>
    </div>
  </aside>

  <main class="flex min-h-0 min-w-0 flex-col overflow-y-auto px-4 pb-4 md:px-6">
    <!-- An exported PDF has no sidebar; this line says what the document is, when it was made and by whom. -->
    <div
      class="text-muted-foreground hidden items-center justify-between gap-4 border-b pb-3 text-xs print:flex"
      data-print-header
    >
      <span class="text-foreground flex items-center gap-2.5">
        <img src="2b-waves.svg" alt="" class="size-6 shrink-0" />
        <span class="text-sm font-semibold tracking-tight">TradingSeason</span>
        <span class="dash-label text-[11px]">Reporting</span>
      </span>
      <span>Exported {{ printedAt() }} by {{ userName() }}</span>
    </div>
    <router-outlet />
  </main>
</div>
