<div
  class="bg-background grid h-dvh grid-cols-1 grid-rows-[auto_minmax(0,1fr)] md:grid-cols-[232px_minmax(0,1fr)] md:grid-rows-1"
>
  <aside
    class="bg-sidebar border-sidebar-border flex flex-wrap items-center gap-x-2 gap-y-1 border-b px-3 pb-2 md:flex-col md:flex-nowrap md:items-stretch md:gap-1 md:border-r md:border-b-0 md:pb-4"
  >
    <a routerLink="/" class="flex h-16 items-center gap-2.5 px-1.5" aria-label="TradingSeason Reporting home">
      <img src="2b-waves.svg" alt="" class="size-7" />
      <span class="flex flex-col leading-[1.15]">
        <span class="text-base font-semibold tracking-tight">TradingSeason</span>
        <span class="dash-label text-[11px]">Reporting</span>
      </span>
    </a>

    <nav aria-label="Reporting" class="order-last flex w-full gap-1 md:order-none md:flex-col">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive
          #link="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
          class="flex h-9 items-center gap-2.5 rounded-lg px-2.5 text-sm transition-colors"
          [class]="
            link.isActive
              ? 'bg-muted text-foreground font-medium'
              : 'text-muted-foreground hover:bg-muted/50 hover:text-foreground'
          "
        >
          <ng-icon [name]="item.icon" size="16" [class.text-primary]="link.isActive" />
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="flex-1"></div>

    <div
      class="border-sidebar-border flex min-w-0 items-center gap-2.5 md:border-t md:px-2 md:pt-3"
    >
      <span
        class="bg-primary/15 text-primary flex size-8 shrink-0 items-center justify-center rounded-full text-xs font-semibold"
        aria-hidden="true"
      >
        {{ userInitials() }}
      </span>
      <span class="hidden min-w-0 flex-1 leading-[1.3] sm:block">
        <span class="block truncate text-sm">{{ userName() }}</span>
        @if (userDetail()) {
          <span class="text-muted-foreground block truncate text-xs">{{ userDetail() }}</span>
        }
      </span>
      <button
        type="button"
        class="text-muted-foreground hover:bg-loss/10 hover:text-loss flex size-8 shrink-0 cursor-pointer items-center justify-center rounded-lg transition-colors"
        aria-label="Log out"
        title="Log out"
        (click)="logout()"
      >
        <ng-icon name="lucideLogOut" size="16" />
      </button>
    </div>
  </aside>

  <main class="min-h-0 min-w-0 overflow-y-auto px-4 pb-4 md:px-6">
    <router-outlet />
  </main>
</div>
