<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:10px;border:1px solid var(--border)}.n{font-size:12px;font-weight:600}.v{font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lab{color:var(--muted-foreground);font-size:.75rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase}</style></head><body><div class="row" style="gap:16px"><div class="sw"><div class="chip" style="background:var(--gradient-net-worth)"></div><div class="n">Net worth</div><div class="v">--gradient-net-worth</div></div><div class="sw"><div class="chip" style="background:var(--gradient-graph-line)"></div><div class="n">Graph line</div><div class="v">--gradient-graph-line</div></div><div class="sw"><div class="chip" style="background:var(--texture-hairlines)"></div><div class="n">Hairline texture</div><div class="v">--texture-hairlines</div></div></div></body></html>
