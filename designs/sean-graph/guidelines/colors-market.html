<!-- @dsCard group="Colors" viewport="700x150" name="Market semantics" subtitle="Gain, loss and their tints" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:10px;border:1px solid var(--border)}.n{font-size:12px;font-weight:600}.v{font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lab{color:var(--muted-foreground);font-size:.75rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--color-gain)"></div><div class="n">Gain</div><div class="v">--color-gain</div></div><div class="sw"><div class="chip" style="background:var(--gain-10)"></div><div class="n">Gain 10%</div><div class="v">--gain-10</div></div><div class="sw"><div class="chip" style="background:var(--color-loss)"></div><div class="n">Loss / destructive</div><div class="v">--color-loss</div></div><div class="sw"><div class="chip" style="background:var(--loss-10)"></div><div class="n">Loss 10%</div><div class="v">--loss-10</div></div><div class="sw"><div class="chip" style="background:var(--primary-15)"></div><div class="n">Primary 15%</div><div class="v">--primary-15</div></div></div></body></html>
