<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:10px;border:1px solid var(--border)}.n{font-size:12px;font-weight:600}.v{font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lab{color:var(--muted-foreground);font-size:.75rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--background)"></div><div class="n">Background</div><div class="v">--background</div></div><div class="sw"><div class="chip" style="background:var(--card)"></div><div class="n">Card / popover</div><div class="v">--card</div></div><div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="n">Muted / secondary</div><div class="v">--muted</div></div><div class="sw"><div class="chip" style="background:var(--ts-ink-900)"></div><div class="n">Net-worth start</div><div class="v">--ts-ink-900</div></div><div class="sw"><div class="chip" style="background:var(--scrim)"></div><div class="n">Scrim</div><div class="v">--scrim</div></div></div></body></html>
