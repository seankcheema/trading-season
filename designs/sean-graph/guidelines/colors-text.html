<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;width:120px}.chip{height:56px;border-radius:10px;border:1px solid var(--border)}.n{font-size:12px;font-weight:600}.v{font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}.lab{color:var(--muted-foreground);font-size:.75rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--foreground)"></div><div class="n">Foreground</div><div class="v">--foreground</div></div><div class="sw"><div class="chip" style="background:var(--muted-foreground)"></div><div class="n">Muted fg (50%)</div><div class="v">--muted-foreground</div></div><div class="sw"><div class="chip" style="background:var(--border)"></div><div class="n">Border (15%)</div><div class="v">--border</div></div><div class="sw"><div class="chip" style="background:var(--border-60)"></div><div class="n">Border 60%</div><div class="v">--border-60</div></div><div class="sw"><div class="chip" style="background:var(--ring)"></div><div class="n">Ring</div><div class="v">--ring</div></div></div></body></html>
