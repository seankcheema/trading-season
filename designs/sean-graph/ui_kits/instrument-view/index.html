<div id="root"></div>

<script type="text/babel" src="CandleChart.jsx"></script>
<script type="text/babel" src="InstrumentView.jsx"></script>
<script type="text/babel">
function InstrumentApp() {
  const { Button, InstrumentSearch } = window.TradingSeasonDesignSystem_86c3eb;
  const initial = new URLSearchParams(location.search).get('symbol') || localStorage.getItem('ts-instrument') || 'AAPL';
  const [symbol, setSymbol] = React.useState(TSData.find(initial) ? initial : 'AAPL');
  const [account, setAccount] = React.useState(1);
  const pick = (s) => { setSymbol(s); localStorage.setItem('ts-instrument', s); };
  return (
    <div style={{ height: '100vh', overflow: 'hidden', padding: '0 24px 16px', background: 'var(--background)' }}>
      <div style={{ margin: '0 auto', display: 'flex', height: '100%', maxWidth: 1600, flexDirection: 'column' }}>
        <AppHeader hideLogo accountId={account} onAccount={setAccount}
          left={<div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <Button variant="outline" size="icon-lg" icon="chevron-left" aria-label="Back to dashboard" onClick={() => { location.href = '../client-ui/index.html'; }} />
            <InstrumentSearch instruments={TSData.INSTRUMENTS} onSelect={(i) => pick(i.symbol)} placeholder="Search instruments" style={{ width: 280 }} />
          </div>} />
        <InstrumentView symbol={symbol} setSymbol={pick} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<InstrumentApp />);
</script>
