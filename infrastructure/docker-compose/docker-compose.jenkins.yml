version: '3.8'

services:
  jenkins:
    build:
      context: ../docker
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-with-nodejs
    ports:
      - "8888:8080"
      - "50000:50000"
    volumes:
      # Persist Jenkins data across container restarts
      - jenkins_home:/var/jenkins_home
      # Allow Jenkins to access Docker daemon for container builds (DooD)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: "-Xmx2g -Xms512m"
      JENKINS_OPTS: "--argumentsRealm.passwd.admin=admin --argumentsRealm.roles.admin=admin"
    restart: unless-stopped
    networks:
      - ci-network

  # Business database (shared by Holdings and Trade, Order and Sell services)
  db:
    image: postgres:16-alpine
    container_name: trading-season-db
    environment:
      POSTGRES_DB: trading_season
      POSTGRES_USER: trading_season
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_season -d trading_season"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - ci-network

  # Database initialization (applies migrations)
  db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../apps/market-data/db/migrations/V001__Initialize_database.sql:/V001__Initialize_database.sql:ro
      - ../../apps/market-data/db/migrations/V002__Add_watchlist.sql:/V002__Add_watchlist.sql:ro
    environment:
      PGPASSWORD: ${DB_PASSWORD:-changeme}
    command: >
      sh -c 'if [ "$$(psql -h db -U trading_season -d trading_season -t -c
      "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='"'"'public'"'"';" 2>/dev/null || echo 0)" = "0" ]; then
      echo "[DB-INIT] Applying migrations...";
      psql -h db -U trading_season -d trading_season -v ON_ERROR_STOP=1 -f /V001__Initialize_database.sql &&
      psql -h db -U trading_season -d trading_season -v ON_ERROR_STOP=1 -f /V002__Add_watchlist.sql
      && echo "[DB-INIT] Migrations complete";
      else echo "[DB-INIT] Database already initialized, skipping migrations"; fi'
    networks:
      - ci-network

  # Authentication service
  auth-service:
    build:
      context: ../../apps/auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    depends_on:
      # Not just the database being up: this service creates no tables, so
      # it needs the migrations applied before its first query.
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: trading_season
      DB_USER: trading_season
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.dualeapa.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    networks:
      - ci-network

  # Holdings and Trade Service
  holdings-and-trade-service:
    build:
      context: ../../apps/holdings-and-trade-service
      dockerfile: Dockerfile
    container_name: holdings-and-trade-service
    ports:
      - "8081:8081"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trading_season
      SPRING_DATASOURCE_USERNAME: trading_season
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      AUTH_JWK_SET_URI: http://auth-service:3001/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${JWT_ISSUER:-https://auth.dualeapa.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    networks:
      - ci-network

  # Order and Sell Service
  order-and-sell-service:
    build:
      context: ../../apps/order-and-sell-service
      dockerfile: Dockerfile
    container_name: order-and-sell-service
    ports:
      - "8082:8082"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trading_season
      SPRING_DATASOURCE_USERNAME: trading_season
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      AUTH_JWK_SET_URI: http://auth-service:3001/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${JWT_ISSUER:-https://auth.dualeapa.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    networks:
      - ci-network

volumes:
  jenkins_home:
  db_data:

networks:
  ci-network:
    driver: bridge
