services:
  client-ui:
    build:
      context: ../..
      dockerfile: apps/client-ui/Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      holdings-and-trade-service:
        condition: service_started

  reporting-ui:
    build:
      context: ../../apps/reporting-ui
      dockerfile: Dockerfile
    ports:
      - "4300:8080"

  reporting-service:
    build:
      context: ../../apps/reporting-service
      dockerfile: Dockerfile
    ports:
      - "8083:8080"

  # Holdings and Trade Service: manages accounts, holdings, and market data
  holdings-and-trade-service:
    build:
      context: ../../apps/holdings-and-trade-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trading_season
      SPRING_DATASOURCE_USERNAME: trading_season
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      AUTH_JWK_SET_URI: http://auth-service:3001/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${JWT_ISSUER:-https://auth.dualeapa.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      MARKET_REPLAY_ARCHIVE_LOCATION: /workspace/apps/market-data/db/seeds/synthetic-market-data-2026-v1
    volumes:
      - market_data_archive:/workspace/apps/market-data/db/seeds:ro

  # Order and Sell Service: manages order execution, validation, and holdings movement
  order-and-sell-service:
    build:
      context: ../../apps/order-and-sell-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trading_season
      SPRING_DATASOURCE_USERNAME: trading_season
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      AUTH_JWK_SET_URI: http://auth-service:3001/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${JWT_ISSUER:-https://auth.dualeapa.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      MARKET_REPLAY_ARCHIVE_LOCATION: /workspace/apps/market-data/db/seeds/synthetic-market-data-2026-v1
    volumes:
      - market_data_archive:/workspace/apps/market-data/db/seeds:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_season
      POSTGRES_USER: trading_season
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      # Db is reachable from the host too, for DBA tooling on the developer's
      # machine during development (frontend/backend never call db directly
      # from the browser — only the backend container talks to db).
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_season -d trading_season"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../apps/market-data/db/migrations/V001__Initialize_database.sql:/V001__Initialize_database.sql:ro
      - ../../apps/market-data/db/migrations/V002__Add_watchlist.sql:/V002__Add_watchlist.sql:ro
    environment:
      PGPASSWORD: ${DB_PASSWORD:-changeme}
    command: >
      sh -c 'if [ "$$(psql -h db -U trading_season -d trading_season -t -c
      "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='"'"'public'"'"';" 2>/dev/null || echo 0)" = "0" ]; then
      echo "[DB-INIT] Applying migrations...";
      psql -h db -U trading_season -d trading_season -v ON_ERROR_STOP=1 -f /V001__Initialize_database.sql &&
      psql -h db -U trading_season -d trading_season -v ON_ERROR_STOP=1 -f /V002__Add_watchlist.sql
      && echo "[DB-INIT] Migrations complete";
      else echo "[DB-INIT] Database already initialized, skipping migrations"; fi'

  db-initialize:
    profiles: ["initialize"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.market-data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - market_data_archive:/workspace/apps/market-data/db/seeds
    command: ["apps/market-data/db/scripts/python/0001-initialize-database.py", "--database-url", "postgresql://trading_season:${DB_PASSWORD:-changeme}@db:5432/trading_season", "--disposable-database"]

  market-data-seed:
    profiles: ["seed"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.market-data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - market_data_archive:/workspace/apps/market-data/db/seeds
    environment:
      # Required because the script container cannot inspect free space inside
      # the separate PostgreSQL volume. Set this to free server storage in GiB.
      MARKET_DATA_AVAILABLE_DISK_GB: ${MARKET_DATA_AVAILABLE_DISK_GB:-}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["python apps/market-data/db/scripts/python/0002-generate-synthetic-market-data.py && python apps/market-data/db/scripts/python/0003-validate-synthetic-market-data.py && python apps/market-data/db/scripts/python/0004-import-synthetic-market-data.py --tick-storage parquet --database-url postgresql://trading_season:${DB_PASSWORD:-changeme}@db:5432/trading_season"]

  auth-service:
    # Authentication and authorization service (KAN-79). Owns credentials and
    # token issuance; the business backend never sees a password.
    build:
      context: ../../apps/auth-service
    ports:
      - "3001:3001"
    depends_on:
      # The auth database container is gone; auth-service reads the shared
      # database, so it waits for the same migration run the Java services do.
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3001
      # Shared with the backend. Flyway owns the schema; this service creates no tables.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: trading_season
      DB_USER: ${DB_USER:-trading_season}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      # RS256 keypair. No default on purpose — the service refuses to start
      # without them, and a committed fallback key is how private keys reach
      # production. Generate with:
      #   node apps/auth-service/scripts/generate-dev-keys.mjs >> .env
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run apps/auth-service/scripts/generate-dev-keys.mjs and append to .env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run apps/auth-service/scripts/generate-dev-keys.mjs and append to .env}
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.dualeapa.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}

volumes:
  db_data:
    # Named volume: persists Postgres data across `docker compose down` and
    # `docker compose up`. Use `docker compose down -v` to also remove this
    # volume, which wipes the database and starts fresh on the next `up`.
  market_data_archive:
    # Reusable generated Parquet archive, independent of PostgreSQL db_data.
