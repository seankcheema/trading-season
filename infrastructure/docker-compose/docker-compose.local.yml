services:
  client-ui:
    build:
      context: ../../apps/client-ui
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      holdings-and-trade-service:
        condition: service_started

  reporting-ui:
    build:
      context: ../../apps/reporting-ui
      dockerfile: Dockerfile
    ports:
      - "4300:8080"

  reporting-service:
    build:
      context: ../../apps/reporting-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    depends_on:
      db-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_started
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "false"
      DATABASE_URL: postgresql://trading_season:${DB_PASSWORD:-changeme}@db:5432/trading_season
      AUTH_SERVICE_URL: http://auth-service:3001
      AUTH_JWT_ISSUER: ${JWT_ISSUER:-https://auth.dualeapa.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:4300}
      REPORTING_SERVICE_PORT: 8083
      REPORTING_SERVICE_HOST: 0.0.0.0
      SCHEDULER_ENABLED: "true"
      SCHEDULER_INTERVAL_MINUTES: 15
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8083/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Holdings and Trade Service: manages accounts, holdings, and market data
  holdings-and-trade-service:
    build:
      context: ../../apps/holdings-and-trade-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trading_season
      SPRING_DATASOURCE_USERNAME: trading_season
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      AUTH_JWK_SET_URI: http://auth-service:3001/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${JWT_ISSUER:-https://auth.dualeapa.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      MARKET_REPLAY_ARCHIVE_LOCATION: /workspace/apps/market-data/db/seeds/synthetic-market-data-2026-v1
    volumes:
      - market_data_archive:/workspace/apps/market-data/db/seeds:ro

  # Order and Sell Service: manages order execution, validation, and holdings movement
  order-and-sell-service:
    build:
      context: ../../apps/order-and-sell-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/trading_season
      SPRING_DATASOURCE_USERNAME: trading_season
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      AUTH_JWK_SET_URI: http://auth-service:3001/.well-known/jwks.json
      AUTH_JWT_ISSUER: ${JWT_ISSUER:-https://auth.dualeapa.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      MARKET_REPLAY_ARCHIVE_LOCATION: /workspace/apps/market-data/db/seeds/synthetic-market-data-2026-v1
    volumes:
      - market_data_archive:/workspace/apps/market-data/db/seeds:ro

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_season
      POSTGRES_USER: trading_season
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      # Db is reachable from the host too, for DBA tooling on the developer's
      # machine during development (frontend/backend never call db directly
      # from the browser — only the backend container talks to db).
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_season -d trading_season"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../apps/market-data/db/migrations:/workspace/apps/market-data/db/migrations:ro
      - ../docker/init-db.sh:/init-db.sh:ro
    environment:
      PGPASSWORD: ${DB_PASSWORD:-changeme}
    command: ["sh", "/init-db.sh", "postgresql://trading_season:${DB_PASSWORD:-changeme}@db:5432/trading_season", "/workspace"]

  # Event broker for the trade-events topic. Nothing publishes or consumes
  # yet; see docs/reference/architecture.md.
  kafka:
    # Single-node KRaft: no ZooKeeper, and the controller quorum is this same
    # node. Sized for a developer machine, not durability -- one replica of
    # everything. Not apache/kafka-native: that image ships only the GraalVM
    # binary, with no /opt/kafka/bin, so the healthcheck below and every
    # console tool used to verify the topic would not exist.
    image: apache/kafka:4.1.1
    ports:
      # Host-facing listener only. In-network clients use kafka:9092, which is
      # deliberately not published.
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # Two listeners on purpose. Containers reach the broker as kafka:9092;
      # processes on the host reach it as localhost:29092. A broker advertises
      # the address clients must reconnect to after bootstrap, so a single
      # listener would hand "kafka:9092" to a host process that cannot resolve
      # it. 0.0.0.0 is explicit so the healthcheck's localhost:9092 does not
      # depend on default-interface semantics.
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092"
      # CONTROLLER is deliberately absent here: Kafka refuses to start when a
      # controller listener appears in advertised.listeners on a broker node.
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      # Required. This image builds server.properties from the KAFKA_*
      # environment alone and discards its own packaged defaults, so without
      # this the broker falls back to the code default /tmp/kafka-logs and the
      # kafka_data volume silently holds nothing.
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # One node, so every internal topic must be replication factor 1. These
      # default to 3 in code and are lost with the packaged properties file.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"
      # No waiting for group members that will never arrive.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # Deliberate. Auto-creation would build a topic on first publish with the
      # broker default of one partition, silently discarding the partition
      # count kafka-init sets and the per-account ordering that depends on it.
      # A typo in a topic name must fail, not create a topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Development sizing; the launch script defaults to -Xmx1G -Xms1G.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      # Not a KAFKA_ variable, so it never reaches server.properties. The image
      # defaults to this same value; pinning it keeps a formatted volume and
      # this configuration in step if that default ever changes.
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka_data:/var/lib/kafka/data
    # Required, not cosmetic. A real API call rather than a port check: the
    # listener socket binds before the broker serves requests, so a TCP probe
    # reports ready too early. And scripts/setup-local.sh waits on a literal
    # `healthy`, falling back to `.State.Status` when no healthcheck exists --
    # which returns `running` forever and stalls startup for its full budget.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 20s
      retries: 15
      start_period: 30s

  # Topic creation. Auto-creation is disabled on the broker, so the topic
  # exists only once this one-shot container has run.
  kafka-init:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    # Overriding the entrypoint is required: this image's own entrypoint starts
    # a broker, so preserving it would run a second one. Same pattern as
    # market-data-seed.
    entrypoint: ["/bin/sh", "-ec"]
    # Three partitions is a decision, not a default. Kafka guarantees order
    # only within a partition, and the pipeline design depends on the account
    # id keying all of one account's events to one partition. The count can be
    # raised later but never safely lowered, and raising it re-hashes keys, so
    # events already written and events written afterwards would land in
    # different partitions for the same account.
    # --if-not-exists makes a rerun a no-op rather than an error.
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists --topic trade-events \
          --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --describe --topic trade-events

  db-initialize:
    profiles: ["initialize"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.market-data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - market_data_archive:/workspace/apps/market-data/db/seeds
    command: ["apps/market-data/db/scripts/python/0001-initialize-database.py", "--database-url", "postgresql://trading_season:${DB_PASSWORD:-changeme}@db:5432/trading_season", "--disposable-database"]

  market-data-seed:
    profiles: ["seed"]
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.market-data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - market_data_archive:/workspace/apps/market-data/db/seeds
    environment:
      # Required because the script container cannot inspect free space inside
      # the separate PostgreSQL volume. Set this to free server storage in GiB.
      MARKET_DATA_AVAILABLE_DISK_GB: ${MARKET_DATA_AVAILABLE_DISK_GB:-}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["python apps/market-data/db/scripts/python/0002-generate-synthetic-market-data.py && python apps/market-data/db/scripts/python/0003-validate-synthetic-market-data.py && python apps/market-data/db/scripts/python/0004-import-synthetic-market-data.py --tick-storage parquet --database-url postgresql://trading_season:${DB_PASSWORD:-changeme}@db:5432/trading_season"]

  auth-service:
    # Authentication and authorization service (KAN-79). Owns credentials and
    # token issuance; the business backend never sees a password.
    build:
      context: ../../apps/auth-service
    ports:
      - "3001:3001"
    depends_on:
      # The auth database container is gone; auth-service reads the shared
      # database, so it waits for the same migration run the Java services do.
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3001
      # Shared with the backend. Flyway owns the schema; this service creates no tables.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: trading_season
      DB_USER: ${DB_USER:-trading_season}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      # RS256 keypair. No default on purpose — the service refuses to start
      # without them, and a committed fallback key is how private keys reach
      # production. Generate with:
      #   node apps/auth-service/scripts/generate-dev-keys.mjs >> .env
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?run apps/auth-service/scripts/generate-dev-keys.mjs and append to .env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?run apps/auth-service/scripts/generate-dev-keys.mjs and append to .env}
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.dualeapa.local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}

volumes:
  db_data:
    # Named volume: persists Postgres data across `docker compose down` and
    # `docker compose up`. Use `docker compose down -v` to also remove this
    # volume, which wipes the database and starts fresh on the next `up`.
  market_data_archive:
    # Reusable generated Parquet archive, independent of PostgreSQL db_data.
  kafka_data:
    # KRaft metadata and partition logs. `docker compose down -v` wipes it;
    # the next up reformats storage and kafka-init recreates the topic.
